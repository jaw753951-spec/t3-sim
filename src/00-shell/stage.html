<!-- ══════════════════════════════════════════════════════════════════
     무대 — 전투 화면. 작업대 위에 통째로 덮는다.
     칸만 있고 글은 없다. 채우는 것은 70-ui/stage*.js 다.

     네 구역이다 — 좌(환자 · 의사 자원) · 중앙(판) · 우(차트) · 아래(손패 줄).
     연출이 붙잡는 이름은 그대로 둔다: #sg_pat(hurt · 뜨는 숫자) · #sg_mind ·
     #sg_hand .card(dealt) · #sg_act(증거 게이지) · #sg_board(촉발 구슬).
     ══════════════════════════════════════════════════════════════ -->
<div id="sg">
<div id="sg_wrap"><div id="sg_stage"><div id="sg_screen">
  <div class="bg"></div>
  <button id="sg_exit" onclick="stageClose()">작업대로 (Esc)</button>

  <!-- 좌 — 환자. 이름이 머리에 오고, 수치는 막대 안에 든다 -->
  <div id="sg_pat">
    <div class="who" id="sg_pwho">환자</div>
    <div class="bust" id="sg_bust"></div><div class="flash"></div>
    <div class="hpbar" id="sg_hpbar"><div class="hf"></div><div class="hg"></div>
      <div class="hpnum" id="sg_hp">—</div></div>
    <div class="tlab"><span class="mn" id="sg_mind">—</span></div>
  </div>

  <!-- 좌 아래 — 의사 자원. 기세는 참조 카드가 있을 때, 관해도는 열린 뒤에만.
       둘 다 꺼져 있으면 JS 가 이 칸을 통째로 비운다 -->
  <div id="sg_doc"></div>

  <!-- 중앙 — 판 -->
  <div id="sg_board">
    <svg id="sg_links" viewBox="0 0 1210 744" preserveAspectRatio="none"></svg>
  </div>
  <div class="plate" id="sg_bubble"><div class="who" id="sg_bwho">환자</div><div class="txt" id="sg_btxt"></div><div class="tail"></div></div>
  <div class="plate" id="sg_actbar"><span class="n" id="sg_an"></span><span class="v" id="sg_av"></span></div>

  <!-- 우 — 차트. 이 사람에 대해 지금까지 알아낸 것만 적는다.
       평소에는 등뼈만 내놓고 숨어 있다 — 마우스를 올리거나 등뼈를 누르면 나온다 -->
  <div id="sg_chartwrap">
    <div class="spine" onclick="chartPin()"><span>차 트</span></div>
    <div id="sg_chart"></div>
  </div>

  <!-- 아래 — 손패 줄 -->
  <div id="sg_handzone">
    <div class="res">
      <div class="tcol">
        <div class="btn treat" id="sg_treat" onclick="stageTreatBtn()">처치<span class="c" id="sg_treatc"></span></div>
        <div class="costlab">코스트</div>
        <div class="pips" id="sg_energy"></div>
      </div>
      <div class="stack go" onclick="pileToggle('deck')"><i></i><i></i>
        <div class="top"><b id="sg_pDeck">0</b><span>덱</span></div></div>
    </div>
    <div id="sg_hand"></div>
    <div class="rres">
      <div class="stack go" onclick="pileToggle('discard')"><i></i><i></i>
        <div class="top"><b id="sg_pDisc">0</b><span>버림</span></div></div>
      <div class="btncol">
        <div class="btn early" id="sg_settle" onclick="stageSettleBtn()">조기 정산<span class="c" id="sg_settlec"></span></div>
        <div class="btn endturn" id="sg_end" onclick="stageEndBtn()">턴 종료</div>
      </div>
    </div>
  </div>
  <div id="sg_toast"></div>

  <!-- 대기 명단 -->
  <div class="ov" id="sg_ovQueue"><div class="obox plate">
    <div class="ohead"><span class="h1" id="sg_qhead">진료</span><span class="h2">환자를 부른다</span>
      <span class="cnt" id="sg_qbud"></span></div>
    <div class="nurse" id="sg_nurse"></div>
    <div class="qlist" id="sg_qlist"></div>
    <div class="ofoot"><span class="n" id="sg_qnote"></span>
      <span class="ogo" id="sg_qgo" onclick="stageQueueGo()">다음 환자를 부른다</span></div>
  </div></div>

  <!-- 문진 -->
  <div class="ov" id="sg_ovAsk"><div class="obox plate">
    <div class="ohead"><span class="h1">문진</span><span class="h2" id="sg_askwho"></span>
      <span class="cnt" id="sg_askcnt"></span></div>
    <div class="alist" id="sg_asklist"></div>
    <div class="ofoot"><span class="n" id="sg_asknote"></span>
      <span class="ogo off" id="sg_askgo" onclick="stageAskGo()">진료를 시작한다</span></div>
  </div></div>

  <!-- 이 환자의 결과 -->
  <div class="ov" id="sg_ovVerd"><div class="obox plate" style="width:560px">
    <div class="vg" id="sg_vg"></div><div class="vs" id="sg_vs"></div>
    <div class="ofoot" style="justify-content:center">
      <span class="ogo" id="sg_vgo" onclick="stageVerdGo()">다음</span></div>
  </div></div>

  <!-- 세션 결산 -->
  <div class="ov" id="sg_ovEnd"><div class="obox plate">
    <div class="ohead"><span class="h1" id="sg_ehead">끝났다</span><span class="h2" id="sg_esub"></span></div>
    <div class="qlist" id="sg_elist"></div>
    <div class="ofoot"><span class="n" id="sg_enote"></span>
      <span class="ogo" onclick="stageClose()">작업대로 돌아간다</span></div>
  </div></div>

  <!-- 스토리 — 병명 선언 · 방침 -->
  <div class="ov" id="sg_ovAct"><div class="obox plate">
    <div class="ohead"><span class="h1" id="sg_acthead"></span><span class="h2" id="sg_actsub"></span>
      <span class="cnt" id="sg_actcnt"></span></div>
    <div id="sg_actbody"></div>
    <div class="ofoot"><span class="n" id="sg_actnote"></span>
      <span class="ogo" id="sg_actgo" onclick="stageActGo()"></span></div>
  </div></div>

</div></div></div>
</div>
